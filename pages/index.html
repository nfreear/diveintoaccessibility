---
title: Redirect
---
<!doctype html>
<html lang="en">
<head>
  <base href="{% myBaseUrl %}">
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; URL=./en/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="canonical" href="{{ '/en/' | myAbsoluteUrl }}">

  <style>
  body {
    font-family: sans-serif;
    line-height: 2;
    margin: auto;
    max-width: 28rem;
    padding: 1rem;
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .fade-in {
    opacity: 0;
    animation-name: fade-in;
    animation-duration: .5s;
    animation-delay: 2s;
    animation-fill-mode: forwards;
    animation-iteration-count: 1;
  }
  </style>

  <title>Redirecting to - Dive Into Accessibility</title>
</head>
<body>
  <header class="fade-in">
    <h1>Dive Into Accessibility</h1>
  </header>
  <p>This page has moved to
    <a href="./en/">Dive Into Accessibility</a>.
  </p>
</body>
</html>
